name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepublish-npm:
    uses: ./.github/workflows/prepublish-npm.yml
    with:
      sha: ${{ github.sha }}
      version: ${{ github.ref_name }}
  release:
    needs: prepublish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Check release prerequisites
        env:
          TAG: ${{ github.ref_name }}
          APT_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vX.Y.Z tag.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          test -s LICENSE
          test -n "$APT_KEY" || { echo 'Set APT_SIGNING_KEY.' >&2; exit 1; }
          test -n "$APT_FINGERPRINT" || { echo 'Set APT_SIGNING_FINGERPRINT.' >&2; exit 1; }
          # The Release body comes from the tag's changelog section; stop before
          # creating a draft if that section is missing or unfinished.
          python3 scripts/test-release-notes.py
          python3 scripts/release-notes.py --version "$TAG" --sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y tmux apt-utils
      - run: make check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSQUAD_PUBLISH: 'true'
      - run: make test-packaging
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package npm distribution
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build-npm.py --version "${TAG#v}"
          npm pack ./dist/npm/package --pack-destination dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/npm/*.tgz
      - name: Generate Homebrew formula
        run: python3 scripts/render-homebrew.py --repository "$GITHUB_REPOSITORY" --license MIT --output dist/tap/Formula/csquad.rb
      - name: Build signed APT repository
        env:
          APT_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_KEY" | gpg --batch --import
          bash scripts/build-apt-repo.sh dist/release dist/site/apt "$APT_FINGERPRINT"
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: dist/tap/Formula/csquad.rb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  # The Release stays a draft until the npm package passes on Linux and macOS.
  # npm-test only needs the uploaded artifact, not public download URLs.
  publish:
    needs: [release, npm-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release-notes.py --version "$TAG" --sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false

  # Homebrew downloads the public release archives, so it can only be tested
  # after publication.
  homebrew-test:
    needs: publish
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: formula
      - name: Install and test the release with Homebrew
        run: |
          tap="$(brew --repository)/Library/Taps/c-squad/homebrew-ci"
          mkdir -p "$tap/Formula"
          cp formula/csquad.rb "$tap/Formula/"
          git -C "$tap" init
          brew install c-squad/ci/csquad
          brew test c-squad/ci/csquad
          brew uninstall csquad
  homebrew:
    needs: [publish, homebrew-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Release runs on a tag; publish the formula to the default branch.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: Formula
      - name: Update formula in this repository
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ruby -c Formula/csquad.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/csquad.rb
          if ! git diff --cached --quiet; then
            git commit -m 'Update csquad formula'
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
  apt:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@v4

  npm-test:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm
      # ubuntu-latest has no Zsh; without it the npm tests skip Zsh completion.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Require shells for completion tests
        run: command -v zsh && command -v bash
      - run: python3 scripts/test-packaging-process.py
      - run: python3 scripts/test-npm.py dist/npm/*.tgz

  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm
      - name: Publish through npm trusted publishing
        run: npm publish dist/npm/*.tgz --access public --provenance
