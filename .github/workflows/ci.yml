name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true
      # TEMPORARY T400 kernel-event diagnostic. Restore the original CI steps
      # byte-for-byte before any release candidate.
      - run: sudo apt-get update && sudo apt-get install -y tmux bpftrace
      - run: bash scripts/diagnose-native-sigchld.sh
