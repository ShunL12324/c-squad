<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <!-- The README banner. Render it to banner.png at 3200x1000 (2x). -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#45475a" fill-opacity="0.5"/>
    </pattern>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="1261" cy="253" r="980" gradientTransform="translate(0 253) scale(1 0.296) translate(0 -253)">
      <stop offset="0" stop-color="#45475a" stop-opacity="0.47"/>
      <stop offset="1" stop-color="#45475a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="500" fill="#1e1e2e"/>
  <rect width="1600" height="500" fill="url(#dots)"/>
  <rect width="1600" height="500" fill="url(#glow)"/>

  <!-- Pixel logo ">_C" on a 24-unit grid -->
  <g fill="#78e8af">
    <rect x="96" y="56" width="24" height="24"/>
    <rect x="120" y="80" width="24" height="24"/>
    <rect x="144" y="104" width="24" height="48"/>
    <rect x="120" y="152" width="24" height="24"/>
    <rect x="96" y="176" width="24" height="24"/>
    <rect x="192" y="176" width="56" height="24"/>
    <rect x="312" y="56" width="80" height="24"/>
    <rect x="288" y="80" width="24" height="96"/>
    <rect x="312" y="176" width="80" height="24"/>
    <rect x="368" y="80" width="24" height="24"/>
    <rect x="368" y="152" width="24" height="24"/>
  </g>

  <text x="96" y="286" font-family="DejaVu Sans, Verdana, sans-serif" font-size="84" font-weight="bold" letter-spacing="-2" fill="#cdd6f4">csquad</text>
  <text font-family="DejaVu Sans, Verdana, sans-serif" font-size="30" fill="#bac2de">
    <tspan x="98" y="340">A squad of background tasks</tspan>
    <tspan x="98" y="378">for Claude Code and Codex.</tspan>
  </text>
  <text x="98" y="440" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="22" fill="#78e8af" xml:space="preserve">$ npx csquad@latest install</text>

  <!-- Your session -->
  <rect x="560" y="170" width="290" height="160" rx="15" fill="#181825" stroke="#585b70" stroke-width="2"/>
  <circle cx="586" cy="196" r="6" fill="#f38ba8"/>
  <circle cx="606" cy="196" r="6" fill="#f9e2af"/>
  <circle cx="626" cy="196" r="6" fill="#a6e3a1"/>
  <text x="584" y="256" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="22" fill="#78e8af" xml:space="preserve">&gt; dispatch 4 tasks</text>
  <text x="584" y="316" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#9399b2">your claude session</text>

  <!-- Wires to the tasks -->
  <g fill="none" stroke="#6c7086" stroke-width="3" stroke-linecap="round">
    <path d="M850 250 C930 250 930 108 1010 108"/>
    <path d="M850 250 C930 250 930 202 1010 202"/>
    <path d="M850 250 C930 250 930 298 1010 298"/>
    <path d="M850 250 C930 250 930 392 1010 392"/>
  </g>
  <g fill="#6c7086">
    <circle cx="850" cy="250" r="6"/>
    <circle cx="1010" cy="108" r="5"/>
    <circle cx="1010" cy="202" r="5"/>
    <circle cx="1010" cy="298" r="5"/>
    <circle cx="1010" cy="392" r="5"/>
  </g>

  <!-- Tasks: a card with the ID and title, then a state pill -->
  <g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="21" xml:space="preserve">
    <g transform="translate(1026 80)">
      <rect width="500" height="56" rx="11.2" fill="#313244"/>
      <path d="M310 0 H488.8 A11.2 11.2 0 0 1 500 11.2 V44.8 A11.2 11.2 0 0 1 488.8 56 H310 Z" fill="#a6e3a1"/>
      <text x="20" y="35" font-weight="bold" fill="#cdd6f4">T1</text>
      <text x="66" y="35" fill="#a6adc8">fix login redirect</text>
      <text x="330" y="35" font-weight="bold" fill="#11111b">✓ done</text>
    </g>
    <g transform="translate(1026 174)">
      <rect width="500" height="56" rx="11.2" fill="#313244"/>
      <path d="M310 0 H488.8 A11.2 11.2 0 0 1 500 11.2 V44.8 A11.2 11.2 0 0 1 488.8 56 H310 Z" fill="#f9e2af"/>
      <text x="20" y="35" font-weight="bold" fill="#cdd6f4">T2</text>
      <text x="66" y="35" fill="#a6adc8">add parser tests</text>
      <text x="330" y="35" font-weight="bold" fill="#11111b">◆ needs input</text>
    </g>
    <g transform="translate(1026 270)">
      <rect width="500" height="56" rx="11.2" fill="#313244"/>
      <path d="M310 0 H488.8 A11.2 11.2 0 0 1 500 11.2 V44.8 A11.2 11.2 0 0 1 488.8 56 H310 Z" fill="#45475a"/>
      <text x="20" y="35" font-weight="bold" fill="#cdd6f4">T3</text>
      <text x="66" y="35" fill="#a6adc8">update the docs</text>
      <text x="330" y="35" fill="#89b4fa">● working</text>
    </g>
    <g transform="translate(1026 364)">
      <rect width="500" height="56" rx="11.2" fill="#313244"/>
      <path d="M310 0 H488.8 A11.2 11.2 0 0 1 500 11.2 V44.8 A11.2 11.2 0 0 1 488.8 56 H310 Z" fill="#45475a"/>
      <text x="20" y="35" font-weight="bold" fill="#cdd6f4">T4</text>
      <text x="66" y="35" fill="#a6adc8">retry sqlite busy</text>
      <text x="330" y="35" fill="#89b4fa">● working</text>
    </g>
  </g>
</svg>
